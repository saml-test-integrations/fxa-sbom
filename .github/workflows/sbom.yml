name: syft-sbom-ci

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syft-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: CycloneDX SBOM Action
        uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: ${{ github.event.release.tag_name || 'manual' }}.cyclonedx-json.json

      - name: SPDX SBOM Action
        uses: anchore/sbom-action@v0.24.0
        with:
          dependency-snapshot: true
          artifact-name: ${{ github.event.release.tag_name || 'manual' }}.spdx.json